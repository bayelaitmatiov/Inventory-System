<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Levels</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; color: #222; margin: 0; }
        nav { background: #f4f4f4; padding: 12px 20px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 14px; text-decoration: none; color: #333; font-weight: 600; }
        .container { padding: 20px; }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
        select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .btn-delete { padding: 6px 10px; border: none; border-radius: 4px; color: #fff; cursor: pointer; background: #dc3545; }
    </style>
</head>
<body>
<nav>
    <a href="/index.html">Dashboard</a>
    <a href="/products.html">Products</a>
    <a href="/warehouses.html">Warehouses</a>
    <a href="/movements.html">Stock Movements</a>
    <a href="/stock-levels.html">Stock Levels</a>
</nav>

<div class="container">
    <h1>Stock Levels</h1>

    <div class="filters">
        <select id="productFilter">
            <option value="">Product</option>
        </select>
        <select id="warehouseFilter">
            <option value="">Warehouse</option>
        </select>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Warehouse</th>
            <th>Quantity</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="stockLevelTable"></tbody>
    </table>
</div>

<script>
    const apiBase = "http://localhost:8080";
    let allLevels = [];

    async function fetchJson(url, options) {
        const res = await fetch(url, options);
        if (!res.ok) {
            throw new Error("Request failed: " + res.status);
        }
        return res.json();
    }

    function populateSelect(selectId, items, labelKey, placeholder) {
        const select = document.getElementById(selectId);
        select.innerHTML = `<option value="">${placeholder}</option>`;
        items.forEach(item => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item[labelKey] ?? "";
            select.appendChild(option);
        });
    }

    function renderTable(levels) {
        const tbody = document.getElementById("stockLevelTable");
        tbody.innerHTML = "";
        levels.forEach(level => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${level.id}</td>
                <td>${level.product?.name ?? ""}</td>
                <td>${level.warehouse?.name ?? ""}</td>
                <td>${level.quantity ?? 0}</td>
                <td>
                    <button class="btn-delete" data-id="${level.id}">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        tbody.querySelectorAll(".btn-delete").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = Number(btn.dataset.id);
                if (confirm("Delete this stock level?")) {
                    await fetch(`${apiBase}/api/stock-levels/${id}`, { method: "DELETE" });
                    await loadStockLevels();
                }
            });
        });
    }

    function applyFilters() {
        const productId = document.getElementById("productFilter").value;
        const warehouseId = document.getElementById("warehouseFilter").value;

        const filtered = allLevels.filter(level => {
            const matchProduct = !productId || String(level.product?.id) === productId;
            const matchWarehouse = !warehouseId || String(level.warehouse?.id) === warehouseId;
            return matchProduct && matchWarehouse;
        });

        renderTable(filtered);
    }

    async function loadStockLevels() {
        const levels = await fetchJson(`${apiBase}/api/stock-levels`);
        allLevels = Array.isArray(levels) ? levels : [];
        applyFilters();
    }

    async function initFilters() {
        const [products, warehouses] = await Promise.all([
            fetchJson(`${apiBase}/api/products`),
            fetchJson(`${apiBase}/api/warehouses`)
        ]);
        populateSelect("productFilter", products, "name", "Product");
        populateSelect("warehouseFilter", warehouses, "name", "Warehouse");
    }

    document.getElementById("productFilter").addEventListener("change", applyFilters);
    document.getElementById("warehouseFilter").addEventListener("change", applyFilters);

    Promise.all([initFilters(), loadStockLevels()]).catch(err => console.error(err));
</script>
</body>
</html>
