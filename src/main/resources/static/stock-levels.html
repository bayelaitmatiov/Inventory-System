<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Levels</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; color: #222; margin: 0; }
        nav { background: #f4f4f4; padding: 12px 20px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 14px; text-decoration: none; color: #333; font-weight: 600; }
        .container { padding: 20px; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
        select, input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; color: #fff; cursor: pointer; background: #1a7f37; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .btn-delete { background: #dc3545; }
    </style>
</head>
<body>
<nav>
    <a href="/index.html">Dashboard</a>
    <a href="/products.html">Products</a>
    <a href="/warehouses.html">Warehouses</a>
    <a href="/movements.html">Stock Movements</a>
    <a href="/stock-levels.html">Stock Levels</a>
</nav>

<div class="container">
    <h1>Stock Levels</h1>

    <form id="stockLevelForm">
        <select id="productSelect" required>
            <option value="">Select product</option>
        </select>
        <select id="warehouseSelect" required>
            <option value="">Select warehouse</option>
        </select>
        <input type="number" id="quantity" placeholder="Quantity" required>
        <button type="submit">Save Stock Level</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Warehouse</th>
            <th>Quantity</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="stockLevelTable"></tbody>
    </table>
</div>

<script>
    const apiBase = "http://localhost:8080";

    async function fetchJson(url, options) {
        const res = await fetch(url, options);
        if (!res.ok) {
            throw new Error("Request failed: " + res.status);
        }
        return res.json();
    }

    function populateSelect(selectId, items, labelKey, placeholder) {
        const select = document.getElementById(selectId);
        select.innerHTML = `<option value="">${placeholder}</option>`;
        items.forEach(item => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item[labelKey] ?? "";
            select.appendChild(option);
        });
    }

    function renderTable(levels) {
        const tbody = document.getElementById("stockLevelTable");
        tbody.innerHTML = "";
        levels.forEach(level => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${level.id}</td>
                <td>${level.product?.name ?? ""}</td>
                <td>${level.warehouse?.name ?? ""}</td>
                <td>${level.quantity ?? 0}</td>
                <td>
                    <button class="btn-delete" data-id="${level.id}">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        tbody.querySelectorAll(".btn-delete").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = Number(btn.dataset.id);
                if (confirm("Delete this stock level?")) {
                    await fetch(`${apiBase}/api/stock-levels/${id}`, { method: "DELETE" });
                    await loadStockLevels();
                }
            });
        });
    }

    async function loadStockLevels() {
        const levels = await fetchJson(`${apiBase}/api/stock-levels`);
        renderTable(levels);
    }

    async function initDropdowns() {
        const [products, warehouses] = await Promise.all([
            fetchJson(`${apiBase}/api/products`),
            fetchJson(`${apiBase}/api/warehouses`)
        ]);
        populateSelect("productSelect", products, "name", "Select product");
        populateSelect("warehouseSelect", warehouses, "name", "Select warehouse");
    }

    document.getElementById("stockLevelForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            product: { id: Number(document.getElementById("productSelect").value) },
            warehouse: { id: Number(document.getElementById("warehouseSelect").value) },
            quantity: Number(document.getElementById("quantity").value)
        };

        await fetchJson(`${apiBase}/api/stock-levels`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        document.getElementById("stockLevelForm").reset();
        await loadStockLevels();
    });

    Promise.all([initDropdowns(), loadStockLevels()]).catch(err => console.error(err));
</script>
</body>
</html>
